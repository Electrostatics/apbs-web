name: Frontend CI

on:
  push:
    branches:
      - azure-release
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test
        run: npm test -- --watchAll=false --runInBand
      - name: Compile frontend without deployment configuration
        run: ./node_modules/.bin/react-scripts build
        env:
          CI: "false"

  compatibility:
    name: Browser and toolchain compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test production assets and development tooling
        run: npm run test:compatibility
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compatibility-failures
          path: test-results
          retention-days: 7
