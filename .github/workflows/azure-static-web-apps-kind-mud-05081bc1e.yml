name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - static-web-app-testing
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - static-web-app-testing

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string
      - name: Set output url
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "OUTPUT_BUCKET_HOST=${{ secrets.AZURE_DEV_OUTPUT_BLOB_STORAGE_URL }}" >> "$GITHUB_ENV"
          else
            echo "OUTPUT_BUCKET_HOST=${{ secrets.AZURE_OUTPUT_BLOB_STORAGE_URL }}" >> "$GITHUB_ENV"
          fi
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_MUD_05081BC1E }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "api" # Api source code path - optional
          output_location: "build" # Built app content directory - optional
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######
        env:
          API_TOKEN_URL: "/api/upload"

  modify_environment_job:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Set deployment environment variables
    needs: build_and_deploy_job
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Login to Azure
        uses: Azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set the required vars
        run: az staticwebapp appsettings set -n static-web-app-testing --setting-names STORAGE_ACCOUNT_KEY=${{ secrets.AZURE_DEV_PRIMARY_ACCESS_KEY }} STORAGE_ACCOUNT_NAME=${{ secrets.AZURE_DEV_ACCOUNT_NAME }} --environment-name ${{ github.event.number }}
      
        

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_MUD_05081BC1E }}
          action: "close"
